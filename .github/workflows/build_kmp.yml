name: Multi-OS Desktop & Android Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android-release-unsigned:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - uses: gradle/actions/setup-gradle@v3

      - name: Configure Gradle memory for CI
        shell: bash
        run: |
          mkdir -p "$HOME/.gradle"
          cat > "$HOME/.gradle/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
          kotlin.daemon.jvmargs=-Xmx1536M
          org.gradle.workers.max=2
          EOF

      - name: Clean & Build Android Release APK (unsigned)
        run: ./gradlew clean :composeApp:assembleRelease

      - name: Upload Android Release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK-Release-Unsigned
          path: composeApp/build/outputs/apk/release/**/*.apk
          if-no-files-found: error

  build-automotive-release-unsigned:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - uses: gradle/actions/setup-gradle@v3

      - name: Configure Gradle memory for CI
        shell: bash
        run: |
          mkdir -p "$HOME/.gradle"
          cat > "$HOME/.gradle/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
          kotlin.daemon.jvmargs=-Xmx1536M
          org.gradle.workers.max=2
          EOF

      - name: Clean & Build Automotive Release APK (unsigned)
        run: ./gradlew clean :automotiveApp:assembleRelease

      - name: Upload Automotive Release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: Automotive-APK-Release-Unsigned
          path: automotiveApp/build/outputs/apk/release/**/*.apk
          if-no-files-found: error

  build-tv-release-unsigned:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - uses: gradle/actions/setup-gradle@v3

      - name: Configure Gradle memory for CI
        shell: bash
        run: |
          mkdir -p "$HOME/.gradle"
          cat > "$HOME/.gradle/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
          kotlin.daemon.jvmargs=-Xmx1536M
          org.gradle.workers.max=2
          EOF

      - name: Clean & Build TV Release APK (unsigned)
        run: ./gradlew clean :tvApp:assembleRelease

      - name: Upload TV Release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: TV-APK-Release-Unsigned
          path: tvApp/build/outputs/apk/release/**/*.apk
          if-no-files-found: error

  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: Linux
          - os: windows-latest
            artifact: Windows
          - os: macos-15
            artifact: macOS-arm64
            arch: arm64
          - os: macos-15-intel
            artifact: macOS-x64
            arch: x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - uses: gradle/actions/setup-gradle@v3

      - name: Clean & Build Desktop App (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat clean :composeApp:packageDistributionForCurrentOS

      - name: Clean & Build Desktop App (Linux/macOS)
        if: runner.os != 'Windows'
        run: ./gradlew clean :composeApp:packageDistributionForCurrentOS

      - name: Rename macOS artifacts with architecture
        if: runner.os == 'macOS'
        shell: bash
        run: |
          find composeApp/build/compose/binaries -type f \( -name "*.dmg" -o -name "*.pkg" \) | while read -r file; do
            dir="$(dirname "$file")"
            base="$(basename "$file")"
            ext="${base##*.}"
            name="${base%.*}"
            mv "$file" "$dir/${name}-${{ matrix.arch }}.${ext}"
          done

      - name: Upload Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Desktop-App-${{ matrix.artifact }}
          path: composeApp/build/compose/binaries/**
          if-no-files-found: error

  release:
    name: Create Release
    needs:
      - build-android-release-unsigned
      - build-automotive-release-unsigned
      - build-tv-release-unsigned
      - build-desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Download all workflow artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Show downloaded files
        shell: bash
        run: find release-assets -type f | sort

      - name: Sign APK artifacts for install
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "ANDROID_HOME or ANDROID_SDK_ROOT is required to sign APKs"
            exit 1
          fi

          BUILD_TOOLS_DIR="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          KEYSTORE="$RUNNER_TEMP/lynmusic-ci-install.jks"
          KEY_ALIAS="lynmusic-ci-install"
          KEYSTORE_PASSWORD="lynmusic-ci-install"
          KEY_PASSWORD="lynmusic-ci-install"

          keytool -genkeypair \
            -keystore "$KEYSTORE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=LynMusic CI Install,O=LynMusic,C=CN" \
            -noprompt

          mkdir -p release-assets-unsigned
          while IFS= read -r -d '' apk; do
            relative_path="${apk#release-assets/}"
            unsigned_apk="release-assets-unsigned/$relative_path"
            aligned_apk="${unsigned_apk%.apk}-aligned.apk"
            signed_apk="release-assets/${relative_path%.apk}-signed.apk"

            mkdir -p "$(dirname "$unsigned_apk")" "$(dirname "$signed_apk")"
            mv "$apk" "$unsigned_apk"
            "$ZIPALIGN" -p -f 4 "$unsigned_apk" "$aligned_apk"
            "$APKSIGNER" sign \
              --ks "$KEYSTORE" \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --key-pass "pass:$KEY_PASSWORD" \
              --out "$signed_apk" \
              "$aligned_apk"
            "$APKSIGNER" verify --verbose "$signed_apk"
          done < <(find release-assets -type f -name "*.apk" -print0)

          find release-assets -type f | sort

      - name: Decide release type
        id: meta
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"

          if [[ "$TAG" =~ -(beta|rc)([.-].*)?$ ]]; then
            echo "kind=prerelease" >> "$GITHUB_OUTPUT"
            echo "title=${TAG} Pre-release" >> "$GITHUB_OUTPUT"
          else
            echo "kind=draft" >> "$GITHUB_OUTPUT"
            echo "title=${TAG} Draft Release" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release notes
        shell: bash
        run: |
          cat > RELEASE_NOTES.md << EOF
          Automated release for tag ${GITHUB_REF_NAME}

          Included artifacts:
          - Android Release APK (signed for install)
          - Automotive Release APK (signed for install)
          - TV Release APK (signed for install)
          - Desktop packages for matrix builds

          Please review the assets before publishing if this is a draft release.
          EOF

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -d '' FILES < <(find release-assets -type f \
            \( -name "*.apk" \
            -o -name "*.aab" \
            -o -name "*.exe" \
            -o -name "*.msi" \
            -o -name "*.dmg" \
            -o -name "*.pkg" \
            -o -name "*.deb" \
            -o -name "*.rpm" \
            -o -name "*.AppImage" \
            -o -name "*.zip" \
            -o -name "*.tar.gz" \) \
            -print0)

          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No release files found"
            exit 1
          fi

          EXTRA_ARGS=()
          if [ "${{ steps.meta.outputs.kind }}" = "prerelease" ]; then
            EXTRA_ARGS+=(--prerelease)
          else
            EXTRA_ARGS+=(--draft)
          fi

          gh release create "${GITHUB_REF_NAME}" \
            "${FILES[@]}" \
            --title "${{ steps.meta.outputs.title }}" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag \
            "${EXTRA_ARGS[@]}"
